<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Four Colors Lightest to Darkest</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="fragments/header :: site-header"></div>

<h1>Random Four Colors Lightest to Darkest</h1>
<a href="/random-four" class="reload-button">Generate New Set</a>
<p>(Note: White, payne's grey, mars black, and black are excluded from the selection)</p>

<div class="random-four-grid">
    <div class="color-card" th:each="color : ${picks}">
        <div class="swatch" th:style="'background-color:' + ${color.hex}">
        </div>
        <div class="label" th:text="${color.name}"></div>
        <div class="number" th:text="${color.number}"></div>
    </div>
</div>

</body>
</html>
